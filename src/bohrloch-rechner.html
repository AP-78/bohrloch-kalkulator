<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root {
  --bg:#0f0f0f;
  --surface:#1a1a1a;
  --surface2:#242424;
  --border:#333333;
  --text:#ffffff;
  --text2:#b0b0b0;
  --text3:#707070;
  --blue:#4a9eff;
  --red:#ff6b6b;
  --accent:#ff8c42;
  --green:#4ade80;
  --teal:#22d3ee;
  --radius:6px;
  --radius-lg:10px;
  --sidebar:300px;
  --font:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'Cascadia Mono','SF Mono',Consolas,'Liberation Mono',monospace;
}

body {
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:2rem 1rem 4rem;
  transition:padding-right 0.3s ease;
}
body.sidebar-open { padding-right:calc(var(--sidebar) + 2rem); }

header {
  width:100%;max-width:640px;margin-bottom:1.5rem;
  display:flex;align-items:center;justify-content:space-between;
}
header h1 { font-size:20px;font-weight:500;letter-spacing:-0.02em; }
header .header-right { display:flex;align-items:center;gap:12px; }
header .version { font-size:12px;color:var(--text3);font-family:var(--mono); }

/* LANGUAGE SWITCH */
.lang-wrap { position:relative; }
.lang-btn {
  width:34px;height:30px;display:flex;align-items:center;justify-content:center;
  background:transparent;color:var(--text2);border:1px solid var(--border);
  border-radius:var(--radius);cursor:pointer;transition:background 0.12s,color 0.12s;
}
.lang-btn:hover,.lang-btn[aria-expanded="true"] { background:var(--surface2);color:var(--text); }
.lang-menu {
  position:absolute;right:0;top:36px;z-index:120;list-style:none;min-width:130px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:4px;box-shadow:0 6px 20px rgba(0,0,0,0.5);
}
.lang-menu[hidden] { display:none; }
.lang-item {
  width:100%;text-align:left;padding:7px 10px;background:transparent;border:none;
  border-radius:4px;color:var(--text2);font-size:13px;font-family:var(--font);cursor:pointer;
}
.lang-item:hover { background:var(--surface2);color:var(--text); }
.lang-item.active { color:var(--blue); }

/* TITLE */
.title-card {
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:0.9rem 1.5rem;
  width:100%;max-width:640px;margin-bottom:1rem;
  display:flex;align-items:center;gap:12px;
}
.title-card label { font-size:12px;color:var(--text2);white-space:nowrap; }
.title-card input {
  flex:1;height:36px;padding:0 12px;font-size:14px;
  font-family:var(--font);color:var(--text);
  background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius);outline:none;
  transition:border-color 0.15s,background 0.15s;
}
.title-card input:focus { border-color:var(--blue);background:#2e2e2e; }
.title-card input::placeholder { color:var(--text3); }

/* CARDS */
.card {
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:1.5rem;
  width:100%;max-width:640px;margin-bottom:1rem;
}
.card-title {
  font-size:11px;font-weight:500;letter-spacing:0.08em;
  text-transform:uppercase;color:var(--text3);
  margin-bottom:1.25rem;display:flex;align-items:center;gap:8px;
}
.card-title::after { content:'';flex:1;height:1px;background:var(--border); }

.input-grid { display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px; }
.field { display:flex;flex-direction:column;gap:5px; }
.field label { font-size:12px;color:var(--text2); }

.input-wrap { display:flex;align-items:center;gap:8px; }
.input-wrap input {
  flex:1;min-width:0;height:40px;padding:0 8px;
  font-size:15px;font-family:var(--mono);
  color:var(--text);background:var(--surface2);
  border:1px solid var(--border);border-radius:var(--radius);
  outline:none;text-align:right;
  transition:border-color 0.15s,background 0.15s;
  -moz-appearance:textfield;
}
.input-wrap input::-webkit-outer-spin-button,
.input-wrap input::-webkit-inner-spin-button { -webkit-appearance:none; }
.input-wrap input:focus { border-color:var(--blue);background:#2e2e2e; }

.btn-group {
  display:flex;flex-shrink:0;
  border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;
}
.step-btn {
  width:34px;height:40px;border:none;border-radius:0;
  background:var(--surface2);color:var(--text2);
  font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  user-select:none;transition:background 0.12s,color 0.12s;
  flex-shrink:0;line-height:1;font-family:var(--mono);
}
.step-btn:first-child { border-right:1px solid var(--border); }
.step-btn:hover { background:var(--border);color:var(--text); }
.step-btn:active { transform:scale(0.94); }

.unit-label {
  font-size:11px;color:var(--text3);font-family:var(--mono);
  width:20px;text-align:left;flex-shrink:0;
}

.formula {
  font-family:var(--mono);font-size:11px;color:var(--text3);
  margin-top:6px;padding:6px 10px;background:var(--surface2);border-radius:var(--radius);
}
.warn { font-size:12px;color:var(--red);margin-top:6px;min-height:18px; }

/* RESULTS */
.results-card {
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);width:100%;max-width:640px;
  overflow:hidden;margin-bottom:1rem;
}
.results-header {
  padding:1rem 1.5rem 0;font-size:11px;font-weight:500;
  letter-spacing:0.08em;text-transform:uppercase;color:var(--text3);
  display:flex;align-items:center;gap:8px;margin-bottom:1rem;
}
.results-header::after { content:'';flex:1;height:1px;background:var(--border); }
.results-grid { display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--border); }
.result-cell { padding:1.25rem 1.5rem;border-right:1px solid var(--border); }
.result-cell:last-child { border-right:none; }
.result-cell .lbl { font-size:11px;color:var(--text3);margin-bottom:6px; }
.result-cell .val {
  font-family:var(--mono);font-size:21px;font-weight:500;
  color:var(--text);letter-spacing:-0.02em;line-height:1;
}
.result-cell .val.blue { color:var(--blue); }
.result-cell .val.accent { color:var(--accent); }
.result-cell .val.muted { color:var(--text3);font-size:17px; }
.result-cell .sub { font-size:11px;color:var(--text3);margin-top:4px;font-family:var(--mono); }

/* SAVE ROW */
.save-row {
  width:100%;max-width:640px;display:flex;
  justify-content:flex-end;gap:8px;margin-bottom:1rem;
}
.save-btn {
  height:38px;padding:0 20px;background:var(--text);color:var(--bg);
  border:none;border-radius:var(--radius);font-size:13px;
  font-family:var(--font);font-weight:500;cursor:pointer;
  transition:opacity 0.15s,transform 0.1s;
}
.save-btn:hover { opacity:0.82; }
.save-btn:active { transform:scale(0.97); }
.save-btn.saved { background:var(--green); }
.save-btn:disabled { opacity:0.35;cursor:not-allowed; }
.clear-btn {
  height:38px;padding:0 16px;background:transparent;color:var(--text2);
  border:1px solid var(--border);border-radius:var(--radius);font-size:13px;
  font-family:var(--font);cursor:pointer;
  transition:background 0.12s,color 0.12s;
}
.clear-btn:hover { background:var(--surface2);color:var(--text); }

/* DIAGRAM */
.diagram-card {
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:1.5rem;
  width:100%;max-width:640px;
}
.diagram-card svg { width:100%;display:block; }

/* SIDEBAR TOGGLES — stacked vertically on right edge */
.panel-toggles {
  position:fixed;
  top:50%;right:0;
  transform:translateY(-50%);
  display:flex;flex-direction:column;gap:4px;
  z-index:100;
  transition:right 0.3s ease;
}
body.sidebar-open .panel-toggles { right:var(--sidebar); }

.panel-toggle {
  writing-mode:vertical-rl;text-orientation:mixed;
  background:var(--text);color:var(--bg);border:none;
  padding:14px 9px;font-size:12px;font-family:var(--font);
  font-weight:500;cursor:pointer;letter-spacing:0.05em;
  border-radius:var(--radius) 0 0 var(--radius);
  display:flex;align-items:center;gap:8px;
  transition:background 0.15s,opacity 0.15s;
  opacity:0.75;
}
.panel-toggle:hover { background:#d0d0d0;opacity:1; }
.panel-toggle.active { background:var(--blue);opacity:1; }

.arch-badge {
  background:var(--bg);color:var(--text);border-radius:50%;
  width:17px;height:17px;font-size:10px;display:flex;
  align-items:center;justify-content:center;font-weight:500;flex-shrink:0;
}

/* SIDEBAR PANEL */
.sidebar {
  position:fixed;top:0;right:calc(-1 * var(--sidebar));width:var(--sidebar);
  height:100vh;background:var(--surface);border-left:1px solid var(--border);
  display:flex;flex-direction:column;transition:right 0.3s ease;z-index:90;
}
body.sidebar-open .sidebar { right:0; }

.sidebar-head {
  padding:1.25rem 1.25rem 1rem;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.sidebar-head h2 { font-size:14px;font-weight:500; }
.close-btn {
  width:28px;height:28px;border:1px solid var(--border);border-radius:var(--radius);
  background:transparent;cursor:pointer;font-size:15px;color:var(--text2);
  display:flex;align-items:center;justify-content:center;
}
.close-btn:hover { background:var(--surface2); }

.panel-body { flex:1;overflow-y:auto;padding:0.75rem; }

/* ARCHIVE */
.archive-empty { text-align:center;color:var(--text3);font-size:13px;padding:2rem 1rem; }

/* ANLEITUNG & INFO panels */
.panel-section { margin-bottom:1.25rem; }
.panel-section h3 {
  font-size:11px;font-weight:500;letter-spacing:0.07em;text-transform:uppercase;
  color:var(--text3);margin-bottom:0.6rem;padding-bottom:6px;
  border-bottom:1px solid var(--border);
}
.panel-ul {
  list-style:none;padding:0;margin:0;
  display:flex;flex-direction:column;gap:8px;
}
.panel-ul li {
  font-size:13px;color:var(--text2);line-height:1.5;
  padding-left:16px;position:relative;
}
.panel-ul li::before {
  content:'·';position:absolute;left:4px;
  color:var(--text3);font-weight:700;
}
.panel-ul li strong { color:var(--text);font-weight:500; }
.panel-p {
  font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:0.75rem;
}
.panel-p a { color:var(--blue); }
.panel-chip {
  display:inline-block;background:var(--surface2);border:1px solid var(--border);
  border-radius:4px;padding:2px 7px;font-size:11px;font-family:var(--mono);
  color:var(--text2);margin:2px 2px 2px 0;
}

.archive-item {
  border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 12px;margin-bottom:8px;cursor:pointer;
  transition:background 0.12s,border-color 0.12s;position:relative;
}
.archive-item:hover { background:var(--surface2);border-color:var(--text3); }
.archive-item.active { border-color:var(--blue);background:rgba(74,158,255,0.12); }
.archive-item .a-title {
  font-size:13px;font-weight:500;margin-bottom:4px;
  padding-right:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.archive-item .a-vals {
  font-family:var(--mono);font-size:11px;color:var(--text2);line-height:1.7;
}
.archive-item .a-date { font-size:10px;color:var(--text3);margin-top:4px;font-family:var(--mono); }
.del-btn {
  position:absolute;top:8px;right:8px;width:20px;height:20px;
  border:none;background:transparent;color:var(--text3);font-size:13px;
  cursor:pointer;border-radius:4px;display:flex;align-items:center;justify-content:center;
  transition:background 0.12s,color 0.12s;
}
.del-btn:hover { background:rgba(255,107,107,0.15);color:var(--red); }

footer { margin-top:2rem;font-size:11px;color:var(--text3);font-family:var(--mono); }
</style>
</head>

  <div class="header-right">
    <span class="version">v3.0 · dark</span>
    <div class="lang-wrap">
      <button class="lang-btn" id="lang_btn" onclick="toggleLangMenu(event)" aria-haspopup="true" aria-expanded="false" data-i18n-title="lang.label" data-i18n-aria="lang.label">

</header>

<div class="title-card">
  <label for="mess_title" data-i18n="title.label"></label>
  <input type="text" id="mess_title" data-i18n-placeholder="title.placeholder" maxlength="60">
</div>

<div class="card">
  <div class="card-title" data-i18n="card.width"></div>
  <div class="input-grid">
    <div class="field">
      <label data-i18n="field.outer"></label>
      <div class="input-wrap">
        <input type="number" id="b_aussen" data-i18n-placeholder="field.placeholder" min="0" step="0.1"
               oninput="calc()" onkeydown="handleKey(event,'b_aussen')">
        <div class="btn-group">
          <button class="step-btn" onclick="step('b_aussen',-0.1)" tabindex="-1">−</button>
          <button class="step-btn" onclick="step('b_aussen',0.1)" tabindex="-1">+</button>
        </div>
        <span class="unit-label">mm</span>
      </div>
    </div>
    <div class="field">
      <label data-i18n="field.inner"></label>
      <div class="input-wrap">
        <input type="number" id="b_innen" data-i18n-placeholder="field.placeholder" min="0" step="0.1"
               oninput="calc()" onkeydown="handleKey(event,'b_innen')">
        <div class="btn-group">
          <button class="step-btn" onclick="step('b_innen',-0.1)" tabindex="-1">−</button>
          <button class="step-btn" onclick="step('b_innen',0.1)" tabindex="-1">+</button>
        </div>
        <span class="unit-label">mm</span>
      </div>
    </div>
  </div>
  <div class="formula" data-i18n="formula.text"></div>
  <div class="warn" id="warn_b"></div>
</div>

<div class="card">
  <div class="card-title" data-i18n="card.height"></div>
  <div class="input-grid">
    <div class="field">
      <label data-i18n="field.outer"></label>
      <div class="input-wrap">
        <input type="number" id="h_aussen" data-i18n-placeholder="field.placeholder" min="0" step="0.1"
               oninput="calc()" onkeydown="handleKey(event,'h_aussen')">
        <div class="btn-group">
          <button class="step-btn" onclick="step('h_aussen',-0.1)" tabindex="-1">−</button>
          <button class="step-btn" onclick="step('h_aussen',0.1)" tabindex="-1">+</button>
        </div>
        <span class="unit-label">mm</span>
      </div>
    </div>
    <div class="field">
      <label data-i18n="field.inner"></label>
      <div class="input-wrap">
        <input type="number" id="h_innen" data-i18n-placeholder="field.placeholder" min="0" step="0.1"
               oninput="calc()" onkeydown="handleKey(event,'h_innen')">
        <div class="btn-group">
          <button class="step-btn" onclick="step('h_innen',-0.1)" tabindex="-1">−</button>
          <button class="step-btn" onclick="step('h_innen',0.1)" tabindex="-1">+</button>
        </div>
        <span class="unit-label">mm</span>
      </div>
    </div>
  </div>
  <div class="formula" data-i18n="formula.text"></div>
  <div class="warn" id="warn_h"></div>
</div>

<div class="results-card">
  <div class="results-header" data-i18n="results.header"></div>
  <div class="results-grid">
    <div class="result-cell">
      <div class="lbl" data-i18n="results.centerWidth"></div>
      <div class="val blue" id="res_b">—</div>
      <div class="sub" id="sub_b"></div>
    </div>
    <div class="result-cell">
      <div class="lbl" data-i18n="results.centerHeight"></div>
      <div class="val blue" id="res_h">—</div>
      <div class="sub" id="sub_h"></div>
    </div>
    <div class="result-cell">
      <div class="lbl" data-i18n="results.diameter"></div>
      <div class="val accent" id="res_d">—</div>
      <div class="sub" id="sub_d"></div>
    </div>
  </div>
</div>

<div class="save-row">
  <button class="clear-btn" onclick="clearForm()" data-i18n="btn.clear"></button>
  <button class="save-btn" id="csv_btn" onclick="exportFusionCsv()" disabled data-i18n="btn.csv"></button>
  <button class="save-btn" id="save_btn" onclick="saveMeasurement()" data-i18n="btn.save"></button>

<script src="i18n.js"></script>
<script>
const FIELD_ORDER = ['b_aussen','b_innen','h_aussen','h_innen'];
const LANG_KEY = 'bhr_lang';
let lastMb = null, lastMh = null, lastD = null, lastDAvg = null, activeId = null;
let lang = 'en';

/* ── i18n ── */
function t(key, vars) {
  let s = (I18N[lang] && I18N[lang][key]) ?? I18N.en[key] ?? key;
  for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
  return s;
}

function initialLang() {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved && I18N[saved]) return saved;
  } catch(e) {}
  const code = (navigator.language || 'en').slice(0, 2).toLowerCase();
  return I18N[code] ? code : 'en';
}

function applyI18n() {
  document.documentElement.lang = lang;
  document.title = t('app.title');
  const each = (attr, fn) => document.querySelectorAll('[' + attr + ']').forEach(el => fn(el, t(el.getAttribute(attr))));
  each('data-i18n', (el, s) => el.textContent = s);
  each('data-i18n-html', (el, s) => el.innerHTML = s);   // only static, trusted strings from i18n.js
  each('data-i18n-placeholder', (el, s) => el.placeholder = s);
  each('data-i18n-title', (el, s) => el.title = s);
  each('data-i18n-aria', (el, s) => el.setAttribute('aria-label', s));
  document.getElementById('lang_menu').innerHTML = Object.keys(I18N).map(code =>
    `<li><button class="lang-item${code === lang ? ' active' : ''}" lang="${code}" onclick="setLang('${code}')">${esc(I18N[code]['lang.name'])}</button></li>`
  ).join('');
}

function setLang(code) {
  if (!I18N[code]) return;
  lang = code;
  try { localStorage.setItem(LANG_KEY, code); } catch(e) {}
  closeLangMenu();
  applyI18n();
  calc();
  renderArchive();
}

function toggleLangMenu(e) {
  e.stopPropagation();
  const menu = document.getElementById('lang_menu');
  menu.hidden = !menu.hidden;
  document.getElementById('lang_btn').setAttribute('aria-expanded', String(!menu.hidden));
}
function closeLangMenu() {
  document.getElementById('lang_menu').hidden = true;
  document.getElementById('lang_btn').setAttribute('aria-expanded', 'false');
}
document.addEventListener('click', closeLangMenu);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLangMenu(); });

/* ── Auto-Focus via Enter/Tab ── */
function handleKey(e, id) {
  if (e.key === 'Enter' || (e.key === 'Tab' && !e.shiftKey)) {
    e.preventDefault();
    const idx = FIELD_ORDER.indexOf(id);
    const next = FIELD_ORDER[idx + 1];
    if (next) document.getElementById(next).focus();
    else document.getElementById('mess_title').focus();
  }
}

/* ── Wert beim Fokus markieren (auch bei programmatischem focus()) ── */
document.addEventListener('focusin', e => {
  if (e.target.matches('.title-card input, .input-wrap input')) e.target.select();
});

/* ── ±0.1 buttons ── */
function step(id, delta) {
  const el = document.getElementById(id);
  const val = parseFloat(el.value) || 0;
  el.value = Math.max(0, Math.round((val + delta) * 10) / 10).toFixed(1);
  calc();
}

/* ── Persist last session ── */
function saveState() {
  const s = {};
  FIELD_ORDER.forEach(f => s[f] = document.getElementById(f).value);
  s.title = document.getElementById('mess_title').value;
  localStorage.setItem('bhr_last', JSON.stringify(s));
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('bhr_last') || '{}');
    FIELD_ORDER.forEach(f => { if (s[f]) document.getElementById(f).value = s[f]; });
    if (s.title) document.getElementById('mess_title').value = s.title;
  } catch(e) {}
  calc();
}

/* ── Clear form ── */
function clearForm() {
  FIELD_ORDER.forEach(f => document.getElementById(f).value = '');
  document.getElementById('mess_title').value = '';
  activeId = null;
  renderArchive();
  calc();
  document.getElementById('b_aussen').focus();
}

/* ── Main calculation ── */
function calc() {
  saveState();
  const ba = parseFloat(document.getElementById('b_aussen').value);
  const bi = parseFloat(document.getElementById('b_innen').value);
  const ha = parseFloat(document.getElementById('h_aussen').value);
  const hi = parseFloat(document.getElementById('h_innen').value);

  let mb = null, mh = null, db = null, dh = null;
  document.getElementById('warn_b').textContent = '';
  document.getElementById('warn_h').textContent = '';

  if (!isNaN(ba) && !isNaN(bi) && ba > 0 && bi > 0) {
    if (bi >= ba) {
      document.getElementById('warn_b').textContent = t('warn.innerGtOuter');
    } else {
      mb = Math.round(((ba + bi) / 2) * 100) / 100;
      db = Math.round(((ba - bi) / 2) * 100) / 100;
      document.getElementById('res_b').textContent = mb.toFixed(2) + ' mm';
    }
  } else {
    document.getElementById('res_b').textContent = '—';
  }

  if (!isNaN(ha) && !isNaN(hi) && ha > 0 && hi > 0) {
    if (hi >= ha) {
      document.getElementById('warn_h').textContent = t('warn.innerGtOuter');
    } else {
      mh = Math.round(((ha + hi) / 2) * 100) / 100;
      dh = Math.round(((ha - hi) / 2) * 100) / 100;
      document.getElementById('res_h').textContent = mh.toFixed(2) + ' mm';
    }
  } else {
    document.getElementById('res_h').textContent = '—';
  }

  const dEl = document.getElementById('res_d');
  const dSub = document.getElementById('sub_d');

  if (db !== null && dh !== null) {
    if (Math.abs(db - dh) < 0.01) {
      dEl.className = 'val accent';
      dEl.textContent = db.toFixed(2) + ' mm';
      dSub.textContent = '';
      lastD = db;
    } else {
      dEl.className = 'val muted';
      dEl.textContent = '≠';
      dSub.textContent = t('results.mismatch', {w: db.toFixed(2), h: dh.toFixed(2)});
      lastD = db;
    }
  } else if (db !== null) {
    dEl.className = 'val accent';
    dEl.textContent = db.toFixed(2) + ' mm';
    dSub.textContent = t('results.fromWidth');
    lastD = db;
  } else if (dh !== null) {
    dEl.className = 'val accent';
    dEl.textContent = dh.toFixed(2) + ' mm';
    dSub.textContent = t('results.fromHeight');
    lastD = dh;
  } else {
    dEl.className = 'val accent';
    dEl.textContent = '—';
    dSub.textContent = '';
    lastD = null;
  }

  lastMb = mb; lastMh = mh;
  document.getElementById('csv_btn').disabled =
    !(mb !== null && mh !== null && db !== null && dh !== null);
  lastDAvg = (db !== null && dh !== null) ? Math.round((db + dh) / 2 * 100) / 100 : null;
  drawDiagram(mb, mh, lastD);
}

/* ── Fusion 360 Parameter-CSV (Format wie Fusion-Export: Name,Einheit,Ausdruck,Wert,Kommentare,Favorit) ── */
function exportFusionCsv() {
  const uml = {'ä':'ae','ö':'oe','ü':'ue','Ä':'Ae','Ö':'Oe','Ü':'Ue','ß':'ss'};
  let name = document.getElementById('mess_title').value
    .replace(/[äöüÄÖÜß]/g, c => uml[c])
    .replace(/[^A-Za-z0-9_]+/g, '_').replace(/^_+|_+$/g, '');
  if (!name) { alert(t('csv.needName')); return; }
  if (/^\d/.test(name)) name = '_' + name;
  const day = new Date().toLocaleDateString('sv-SE'); // YYYY-MM-DD, lokale Zeit
  const field = s => /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  const row = (suffix, v) => `${name}_bl_${suffix},mm,${v} mm,${v.toFixed(2)},${field(t('csv.comment', {d: day}))},false`;
  const csv = [t('csv.header'),
    row('h', lastMb), row('v', lastMh), row('dia', lastDAvg)].join('\r\n') + '\r\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = `${name}_params_${day}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ── Save measurement ── */
function saveMeasurement() {
  const title = document.getElementById('mess_title').value.trim();   // leer = Standardname beim Anzeigen (i18n)

  const entry = {
    id: Date.now(),
    ts: Date.now(),
    title,
    b_aussen: document.getElementById('b_aussen').value,
    b_innen:  document.getElementById('b_innen').value,
    h_aussen: document.getElementById('h_aussen').value,
    h_innen:  document.getElementById('h_innen').value,
    mb: lastMb, mh: lastMh, d: lastD
  };

  const db = getDB();
  // update if same title already exists as active
  if (activeId) {
    const idx = db.findIndex(x => x.id === activeId);
    if (idx > -1) { entry.id = activeId; db[idx] = entry; }
    else db.unshift(entry);
  } else {
    db.unshift(entry);
    activeId = entry.id;
  }
  localStorage.setItem('bhr_archive', JSON.stringify(db));
  renderArchive();

  const btn = document.getElementById('save_btn');
  btn.textContent = t('btn.saved');
  btn.classList.add('saved');
  setTimeout(() => { btn.textContent = t('btn.save'); btn.classList.remove('saved'); }, 1800);
}

/* ── Archive DB ── */
function getDB() {
  try { return JSON.parse(localStorage.getItem('bhr_archive') || '[]'); } catch(e) { return []; }
}

function loadMeasurement(entry) {
  activeId = entry.id;
  document.getElementById('mess_title').value = entry.title;
  FIELD_ORDER.forEach(f => { document.getElementById(f).value = entry[f] || ''; });
  calc();
  renderArchive();
}

function deleteMeasurement(id, e) {
  e.stopPropagation();
  if (activeId === id) activeId = null;
  const db = getDB().filter(x => x.id !== id);
  localStorage.setItem('bhr_archive', JSON.stringify(db));
  renderArchive();
}

function formatStamp(ms) {
  const d = new Date(ms);
  return d.toLocaleDateString(lang, {day:'2-digit',month:'2-digit',year:'numeric'})
    + ' ' + d.toLocaleTimeString(lang, {hour:'2-digit',minute:'2-digit'});
}

function renderArchive() {
  const db = getDB();
  document.getElementById('arch_count').textContent = db.length;
  const list = document.getElementById('archive_list');
  if (!list) return;

  if (!db.length) {
    list.innerHTML = '<div class="archive-empty">' + esc(t('archive.empty')) + '</div>';
    return;
  }

  list.innerHTML = db.map(e => {
    const isActive = e.id === activeId;
    const mbStr = e.mb ? e.mb.toFixed(2) : '—';
    const mhStr = e.mh ? e.mh.toFixed(2) : '—';
    const dStr  = e.d  ? t('archive.dia', {d: e.d.toFixed(2)}) : '';
    const dash = '—';
    return `<div class="archive-item${isActive?' active':''}" onclick='loadEntry(${e.id})'>
      <button class="del-btn" onclick="deleteMeasurement(${e.id},event)" title="${esc(t('btn.delete'))}">✕</button>
      <div class="a-title">${esc(e.title || t('project.default'))}</div>
      <div class="a-vals">
        ${esc(t('archive.width', {a: e.b_aussen || dash, i: e.b_innen || dash}))}<br>
        ${esc(t('archive.height', {a: e.h_aussen || dash, i: e.h_innen || dash}))}<br>
        ${esc(t('archive.result', {mb: mbStr, mh: mhStr}))}${dStr ? ' · ' + esc(dStr) : ''}
      </div>
      <div class="a-date">${formatStamp(e.ts || e.id)}</div>
    </div>`;
  }).join('');
}

function loadEntry(id) {
  const db = getDB();
  const e = db.find(x => x.id === id);
  if (e) loadMeasurement(e);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── Panels ── */
let activePanel = null;

function openPanel(name) {
  if (activePanel === name) { closePanel(); return; }
  activePanel = name;
  document.body.classList.add('sidebar-open');
  ['archiv','anleitung','info'].forEach(p => {
    document.getElementById('panel_' + p).style.display = p === name ? 'flex' : 'none';
    document.getElementById('panel_' + p).style.flexDirection = 'column';
    document.getElementById('panel_' + p).style.height = '100%';
    document.getElementById('tog_' + p).classList.toggle('active', p === name);
  });
}

function closePanel() {
  activePanel = null;
  document.body.classList.remove('sidebar-open');
  ['archiv','anleitung','info'].forEach(p => {
    document.getElementById('tog_' + p).classList.remove('active');
  });
}

/* ── Diagram ── */
function drawDiagram(mb, mh, d) {
  const svg = document.getElementById('diagram');
  const colDim    = '#707070';
  const colHole   = '#4a9eff';
  const colCenter = '#ff8c42';
  const colBorder = '#333333';
  const colDiam   = '#22d3ee';
  const colBg     = '#0f0f0f';
  const mono = "ui-monospace,'Cascadia Mono',Consolas,monospace";

  const H = 230;
  const bw = 280, bh = 150;
  const bx = 110, by = (H - bh) / 2;
  const r = d ? Math.min(Math.max(d * 2, 9), 26) : 11;
  // 4 Bohrlöcher an den Ecken
  const cx1 = bx + r, cy1 = by + r;              // oben links
  const cx2 = bx + bw - r, cy2 = by + r;         // oben rechts
  const cx3 = bx + r, cy3 = by + bh - r;         // unten links
  const cx4 = bx + bw - r, cy4 = by + bh - r;    // unten rechts

  let out = '';
  out += `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="5" fill="${colBg}" stroke="${colBorder}" stroke-width="1"/>`;
  // 4 Bohrlöcher zeichnen
  out += `<circle cx="${cx1}" cy="${cy1}" r="${r}" fill="white" stroke="${colHole}" stroke-width="1.5"/>`;
  out += `<circle cx="${cx2}" cy="${cy2}" r="${r}" fill="white" stroke="${colHole}" stroke-width="1.5"/>`;
  out += `<circle cx="${cx3}" cy="${cy3}" r="${r}" fill="white" stroke="${colHole}" stroke-width="1.5"/>`;
  out += `<circle cx="${cx4}" cy="${cy4}" r="${r}" fill="white" stroke="${colHole}" stroke-width="1.5"/>`;
  // Mittelpunkte markieren
  out += `<circle cx="${cx1}" cy="${cy1}" r="2.5" fill="${colCenter}"/>`;
  out += `<circle cx="${cx2}" cy="${cy2}" r="2.5" fill="${colCenter}"/>`;
  out += `<circle cx="${cx3}" cy="${cy3}" r="2.5" fill="${colCenter}"/>`;
  out += `<circle cx="${cx4}" cy="${cy4}" r="2.5" fill="${colCenter}"/>`;

  if (d) {
    const le = cx4 + r + 28;
    out += `<line x1="${cx4}" y1="${cy4-r}" x2="${le}" y2="${cy4-r}" stroke="${colDiam}" stroke-width="0.8" stroke-dasharray="3 2"/>`;
    out += `<line x1="${cx4}" y1="${cy4+r}" x2="${le}" y2="${cy4+r}" stroke="${colDiam}" stroke-width="0.8" stroke-dasharray="3 2"/>`;
    out += `<line x1="${le}" y1="${cy4-r}" x2="${le}" y2="${cy4+r}" stroke="${colDiam}" stroke-width="1"/>`;
    out += `<line x1="${le-4}" y1="${cy4-r}" x2="${le+4}" y2="${cy4-r}" stroke="${colDiam}" stroke-width="1"/>`;
    out += `<line x1="${le-4}" y1="${cy4+r}" x2="${le+4}" y2="${cy4+r}" stroke="${colDiam}" stroke-width="1"/>`;
    out += `<text x="${le+8}" y="${cy4+4}" font-size="11" fill="${colDiam}" font-family="${mono}">Ø ${d.toFixed(2)}</text>`;
  }

  // Horizontale Maßlinie (zwischen oben links und oben rechts)
  const lblB = mb ? mb.toFixed(2)+' mm' : '?';
  const yD = H - 10;
  out += `<line x1="${cx1}" y1="${yD}" x2="${cx2}" y2="${yD}" stroke="${colDim}" stroke-width="0.8"/>`;
  out += `<line x1="${cx1}" y1="${yD-4}" x2="${cx1}" y2="${yD+4}" stroke="${colDim}" stroke-width="0.8"/>`;
  out += `<line x1="${cx2}" y1="${yD-4}" x2="${cx2}" y2="${yD+4}" stroke="${colDim}" stroke-width="0.8"/>`;
  out += `<text x="${(cx1+cx2)/2}" y="${H}" text-anchor="middle" font-size="11" fill="${colDim}" font-family="${mono}">${lblB}</text>`;

  // Vertikale Maßlinie (zwischen oben links und unten links)
  const lblH = mh ? mh.toFixed(2)+' mm' : '?';
  const xD = bx - 16;
  out += `<line x1="${xD}" y1="${cy1}" x2="${xD}" y2="${cy3}" stroke="${colDim}" stroke-width="0.8"/>`;
  out += `<line x1="${xD-4}" y1="${cy1}" x2="${xD+4}" y2="${cy1}" stroke="${colDim}" stroke-width="0.8"/>`;
  out += `<line x1="${xD-4}" y1="${cy3}" x2="${xD+4}" y2="${cy3}" stroke="${colDim}" stroke-width="0.8"/>`;
  out += `<text x="${xD}" y="${(cy1+cy3)/2+4}" text-anchor="middle" font-size="11" fill="${colDim}" font-family="${mono}" transform="rotate(-90,${xD},${(cy1+cy3)/2+4})">${lblH}</text>`;

  // Beschriftung der 4 Bohrlöcher
  out += `<text x="${cx1+r+5}" y="${cy1-r-4}" font-size="10" fill="${colHole}" font-family="${mono}">${esc(t('diagram.hole', {n: 1}))}</text>`;
  out += `<text x="${cx2-r-38}" y="${cy2-r-4}" font-size="10" fill="${colHole}" font-family="${mono}">${esc(t('diagram.hole', {n: 2}))}</text>`;
  out += `<text x="${cx3+r+5}" y="${cy3+r+14}" font-size="10" fill="${colHole}" font-family="${mono}">${esc(t('diagram.hole', {n: 3}))}</text>`;
  out += `<text x="${cx4-r-38}" y="${cy4+r+14}" font-size="10" fill="${colHole}" font-family="${mono}">${esc(t('diagram.hole', {n: 4}))}</text>`;

  svg.innerHTML = out;
}

/* ── Init ── */
lang = initialLang();
applyI18n();
loadState();
renderArchive();
document.getElementById('b_aussen').focus();
</script>
